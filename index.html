<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <meta name="theme-color" content="#173f2d" />
    <title>本地点货本</title>
    <style>
      :root {
        --ink: #17221b;
        --muted: #68736b;
        --line: #dce3de;
        --paper: #ffffff;
        --canvas: #f3f5f2;
        --green: #176b45;
        --green-dark: #0f5636;
        --green-soft: #e8f3ec;
        --amber: #a85c18;
        --amber-soft: #fff4e8;
        --red: #b23b35;
        --shadow: 0 12px 36px rgba(24, 48, 33, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--canvas);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% -8%, rgba(23, 107, 69, 0.09), transparent 34rem),
          var(--canvas);
        font-family:
          Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        color: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid rgba(23, 107, 69, 0.22);
        outline-offset: 2px;
      }

      .shell {
        width: min(1320px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 110px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--green);
        font-size: 12px;
        font-weight: 850;
        letter-spacing: 0.12em;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      .topbar h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: -0.045em;
      }

      .current-date {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 780;
      }

      .top-actions {
        position: relative;
        display: flex;
        gap: 10px;
      }

      .button {
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 11px;
        font-weight: 800;
        cursor: pointer;
        transition:
          background 0.15s ease,
          transform 0.15s ease,
          border-color 0.15s ease;
      }

      .button:active {
        transform: scale(0.98);
      }

      .button.primary {
        background: var(--green);
        color: #fff;
      }

      .button.primary:hover {
        background: var(--green-dark);
      }

      .button.secondary {
        border-color: var(--line);
        background: var(--paper);
      }

      .button.secondary:hover {
        border-color: #b8c9bd;
        background: #f9fbf9;
      }

      .button.danger {
        border-color: #e5c4c1;
        background: #fff;
        color: var(--red);
      }

      .button.small {
        min-height: 36px;
        padding: 0 12px;
        font-size: 13px;
      }

      .icon-button {
        width: 44px;
        height: 44px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--paper);
        font-weight: 900;
        cursor: pointer;
      }

      .menu {
        position: absolute;
        z-index: 30;
        top: 51px;
        right: 0;
        width: 210px;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--paper);
        box-shadow: 0 18px 50px rgba(20, 37, 26, 0.16);
      }

      .menu[hidden] {
        display: none;
      }

      .menu button {
        display: block;
        width: 100%;
        padding: 11px 12px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .menu button:hover {
        background: var(--green-soft);
      }

      .menu button.danger-text {
        color: var(--red);
      }

      .privacy-note {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 15px;
        margin-bottom: 16px;
        border: 1px solid #cfe1d5;
        border-radius: 13px;
        background: var(--green-soft);
        color: #315a43;
        font-size: 13px;
      }

      .privacy-note strong {
        color: var(--green-dark);
      }

      .privacy-dot {
        flex: 0 0 auto;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #3ca36a;
        box-shadow: 0 0 0 4px rgba(60, 163, 106, 0.12);
      }

      .date-panel {
        display: grid;
        grid-template-columns: minmax(240px, 0.85fr) minmax(360px, 1.4fr);
        gap: 16px;
        padding: 18px;
        margin-bottom: 16px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .date-main {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .date-main input {
        min-width: 0;
        height: 44px;
        flex: 1;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fbfcfb;
        color: var(--ink);
        font-weight: 780;
      }

      .date-nav {
        flex: 0 0 42px;
        width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f7f9f7;
        color: var(--green-dark);
        font-size: 20px;
        font-weight: 900;
        cursor: pointer;
      }

      .date-nav:disabled {
        opacity: 0.38;
        cursor: not-allowed;
      }

      .date-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
      }

      .date-title {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }

      .date-title strong {
        color: var(--ink);
        font-size: 16px;
      }

      .today-badge {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green-dark);
        font-size: 12px;
        font-weight: 850;
      }

      .history-badge {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: #eef0ee;
        color: #5e6861;
        font-size: 12px;
        font-weight: 850;
      }

      .recent-wrap > p {
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
      }

      .recent-days {
        display: grid;
        grid-template-columns: repeat(7, minmax(62px, 1fr));
        gap: 7px;
      }

      .recent-day {
        min-height: 64px;
        padding: 8px 4px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fafbfa;
        text-align: center;
        cursor: pointer;
      }

      .recent-day:hover {
        border-color: #b4c9bb;
      }

      .recent-day.active {
        border-color: var(--green);
        background: var(--green-soft);
        box-shadow: inset 0 0 0 1px var(--green);
      }

      .recent-day strong,
      .recent-day small {
        display: block;
      }

      .recent-day strong {
        margin-bottom: 4px;
        font-size: 13px;
      }

      .recent-day small {
        color: var(--muted);
        font-size: 10px;
      }

      .recent-day.has-data small {
        color: var(--green);
        font-weight: 800;
      }

      .history-warning {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px 14px;
        margin-bottom: 14px;
        border: 1px solid #efd1ae;
        border-radius: 13px;
        background: var(--amber-soft);
        color: #76502e;
        font-size: 13px;
      }

      .history-warning strong {
        color: var(--amber);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .search {
        display: flex;
        align-items: center;
        width: min(480px, 100%);
        min-height: 44px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--paper);
      }

      .search span {
        margin-right: 8px;
        color: var(--muted);
        font-size: 20px;
      }

      .search input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
      }

      .item-count {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 13px;
      }

      .stock-head,
      .stock-row {
        display: grid;
        grid-template-columns: minmax(190px, 1.05fr) repeat(3, minmax(190px, 1fr)) minmax(130px, 0.72fr);
        gap: 10px;
      }

      .stock-head {
        padding: 0 12px 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
        text-align: center;
      }

      .stock-head div:first-child {
        text-align: left;
      }

      .stock-row {
        padding: 12px;
        margin-bottom: 10px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--paper);
        box-shadow: 0 5px 20px rgba(30, 50, 36, 0.035);
      }

      .item-identity {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
        padding: 8px;
      }

      .item-number {
        margin-bottom: 4px;
        color: #8a938d;
        font-size: 11px;
        font-weight: 800;
      }

      .item-identity h2 {
        margin: 0 0 7px;
        overflow-wrap: anywhere;
        font-size: 18px;
        line-height: 1.25;
      }

      .unit-tag {
        align-self: flex-start;
        padding: 4px 8px;
        border-radius: 999px;
        background: #f0f3f1;
        color: #667069;
        font-size: 11px;
        font-weight: 800;
      }

      .stock-cell {
        min-width: 0;
        padding: 10px;
        border: 1px solid #e7ece8;
        border-radius: 12px;
        background: #fbfcfb;
      }

      .stock-cell h3 {
        display: none;
        margin: 0 0 8px;
        color: var(--green-dark);
        font-size: 12px;
      }

      .count-line + .count-line {
        margin-top: 8px;
      }

      .stepper {
        display: grid;
        grid-template-columns: 34px minmax(74px, 1fr) 34px;
        height: 40px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }

      .stepper button {
        border: 0;
        background: #eff3f0;
        color: var(--green-dark);
        font-size: 19px;
        font-weight: 900;
        cursor: pointer;
      }

      .stepper button:hover:not(:disabled) {
        background: var(--green-soft);
      }

      .stepper button:disabled {
        color: #aeb5b0;
        cursor: not-allowed;
      }

      .quantity-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }

      .quantity-wrap input {
        width: 52px;
        min-width: 0;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        text-align: right;
        font-size: 17px;
        font-weight: 850;
        -moz-appearance: textfield;
      }

      .quantity-wrap input::-webkit-inner-spin-button {
        display: none;
      }

      .quantity-wrap input:disabled {
        color: #5e6861;
        opacity: 1;
        -webkit-text-fill-color: #5e6861;
      }

      .quantity-wrap span {
        min-width: 24px;
        margin-left: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }

      .total-cell {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 9px;
        padding: 12px;
        border-radius: 12px;
        background: #183f2d;
        color: #fff;
      }

      .total-cell h3 {
        display: none;
        margin: 0;
        color: #bfe0ca;
        font-size: 12px;
      }

      .total-line {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        gap: 5px;
      }

      .total-line strong {
        font-size: 23px;
      }

      .total-line span {
        min-width: 24px;
        color: rgba(255, 255, 255, 0.68);
        font-size: 11px;
        font-weight: 750;
      }

      .empty-result {
        padding: 50px 20px;
        border: 1px dashed #c6cfc9;
        border-radius: 15px;
        color: var(--muted);
        text-align: center;
      }

      .setup-card {
        width: 100%;
        margin: 28px auto 0;
        padding: 0;
      }

      .setup-card h2 {
        margin-bottom: 8px;
        font-size: 25px;
      }

      .setup-intro {
        margin-bottom: 22px;
        color: var(--muted);
        line-height: 1.7;
      }

      .setup-row-number {
        display: block;
        margin-bottom: 6px;
        color: #929a94;
        font-size: 12px;
        font-weight: 850;
      }

      .setup-row .item-identity {
        display: block;
      }

      .setup-row .item-name-input,
      .setup-row .item-unit-select {
        width: 100%;
        height: 40px;
        padding: 0 11px;
        border: 1px solid #ccd5cf;
        border-radius: 9px;
        background: #fff;
        color: var(--ink);
      }

      .setup-row .item-name-input {
        margin-bottom: 8px;
      }

      .setup-unit-row {
        display: block;
      }

      .setup-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-top: 12px;
      }

      .setup-actions {
        display: flex;
        gap: 9px;
      }

      .setup-help {
        margin: 18px 0 0;
        padding: 13px 14px;
        border-radius: 12px;
        background: #f3f6f4;
        color: #68736b;
        font-size: 12px;
        line-height: 1.65;
      }

      .footer-note {
        padding: 24px 0 0;
        color: #858e88;
        text-align: center;
        font-size: 12px;
      }

      .toast {
        position: fixed;
        z-index: 100;
        top: 22px;
        left: 50%;
        max-width: calc(100% - 30px);
        transform: translateX(-50%);
        padding: 11px 17px;
        border-radius: 999px;
        background: #14261b;
        color: #fff;
        box-shadow: 0 12px 35px rgba(10, 27, 16, 0.22);
        font-size: 13px;
        font-weight: 780;
      }

      .toast[hidden],
      .hidden-file {
        display: none;
      }

      @media (max-width: 1000px) {
        .date-panel {
          grid-template-columns: 1fr;
        }

        .stock-head {
          display: none;
        }

        .stock-row {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .item-identity {
          grid-column: 1 / -1;
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          align-items: center;
        }

        .item-number {
          grid-column: 1;
        }

        .item-identity h2 {
          grid-column: 1;
          margin-bottom: 0;
        }

        .unit-tag {
          grid-column: 2;
          grid-row: 1 / 3;
        }

        .stock-cell h3,
        .total-cell h3 {
          display: block;
        }
      }

      @media (max-width: 660px) {
        .shell {
          width: min(100% - 20px, 620px);
          padding-top: 18px;
        }

        .topbar {
          align-items: flex-start;
        }

        .topbar h1 {
          font-size: 28px;
        }

        .privacy-note {
          align-items: flex-start;
        }

        .date-panel {
          padding: 13px;
        }

        .recent-days {
          grid-template-columns: repeat(4, 1fr);
        }

        .recent-day:nth-child(-n + 3) {
          display: none;
        }

        .history-warning {
          align-items: flex-start;
          flex-direction: column;
        }

        .toolbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .search {
          width: 100%;
        }

        .stock-row {
          gap: 8px;
          padding: 9px;
        }

        .stock-cell {
          padding: 8px;
        }

        .stepper {
          grid-template-columns: 31px minmax(62px, 1fr) 31px;
        }

        .quantity-wrap input {
          width: 42px;
        }

        .setup-card {
          margin-top: 12px;
          padding: 0;
        }

        .setup-row .item-name-input,
        .setup-row .item-unit-select {
          padding: 0 8px;
        }

        .setup-footer {
          align-items: stretch;
          flex-direction: column;
        }

        .setup-actions {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 370px) {
        .stock-row {
          grid-template-columns: 1fr;
        }

        .item-identity {
          grid-column: 1;
        }

        .recent-days {
          grid-template-columns: repeat(2, 1fr);
        }

        .recent-day:nth-child(-n + 5) {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <input id="importFile" class="hidden-file" type="file" accept="application/json,.json" />

    <script>
      "use strict";

      var STORAGE_KEY = "kitchen-inventory-local-v1";
      var LOCATIONS = [
        { key: "ambient", label: "常温" },
        { key: "freezer", label: "冻房" },
        { key: "cooler", label: "风房" }
      ];
      var UNITS = ["箱", "桶", "兜"];
      var app = document.getElementById("app");
      var toastElement = document.getElementById("toast");
      var importFile = document.getElementById("importFile");
      var toastTimer = null;
      var lastKnownToday = todayKey();

      var state = loadState();
      var view = {
        screen: state.items.length ? "inventory" : "setup",
        selectedDate: todayKey(),
        editHistory: false,
        search: "",
        menuOpen: false,
        editingExistingList: false,
        draftItems: state.items.length ? [] : makeBlankRows(24)
      };

      function todayKey() {
        var date = new Date();
        return [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, "0"),
          String(date.getDate()).padStart(2, "0")
        ].join("-");
      }

      function dateFromKey(key) {
        var parts = key.split("-").map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0);
      }

      function shiftDate(key, amount) {
        var date = dateFromKey(key);
        date.setDate(date.getDate() + amount);
        return [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, "0"),
          String(date.getDate()).padStart(2, "0")
        ].join("-");
      }

      function prettyDate(key, includeYear) {
        var date = dateFromKey(key);
        return date.toLocaleDateString("zh-CN", {
          year: includeYear ? "numeric" : undefined,
          month: "long",
          day: "numeric",
          weekday: "short"
        });
      }

      function makeId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return "item-" + Date.now() + "-" + Math.random().toString(16).slice(2);
      }

      function makeBlankRows(count) {
        var rows = [];
        for (var i = 0; i < count; i += 1) {
          rows.push({
            id: makeId(),
            name: "",
            unit: "箱",
            counts: makeEmptyDraftCounts()
          });
        }
        return rows;
      }

      function makeEmptyDraftCounts() {
        var counts = {};
        LOCATIONS.forEach(function (location) {
          counts[location.key] = { main: 0, bags: 0 };
        });
        return counts;
      }

      function normalizeDraftCounts(counts) {
        var normalized = {};
        LOCATIONS.forEach(function (location) {
          var locationCount = counts && counts[location.key] ? counts[location.key] : {};
          normalized[location.key] = {
            main: cleanNumber(locationCount.main),
            bags: cleanNumber(locationCount.bags)
          };
        });
        return normalized;
      }

      function draftTotals(item) {
        var total = LOCATIONS.reduce(
          function (total, location) {
            var count = item.counts[location.key];
            total.main += cleanNumber(count.main);
            total.bags += cleanNumber(count.bags);
            return total;
          },
          { main: 0, bags: 0 }
        );
        return {
          main: cleanNumber(total.main),
          bags: cleanNumber(total.bags)
        };
      }

      function newState() {
        return {
          version: 1,
          createdDate: todayKey(),
          items: [],
          records: {}
        };
      }

      function loadState() {
        try {
          var saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return newState();
          var parsed = JSON.parse(saved);
          if (
            !parsed ||
            parsed.version !== 1 ||
            !Array.isArray(parsed.items) ||
            !parsed.records ||
            typeof parsed.records !== "object"
          ) {
            return newState();
          }
          parsed.createdDate = parsed.createdDate || todayKey();
          parsed.items = parsed.items
            .filter(function (item) {
              return item && typeof item.name === "string" && item.name.trim();
            })
            .map(function (item) {
              return {
                id: String(item.id || makeId()),
                name: item.name.trim(),
                unit: UNITS.indexOf(item.unit) >= 0 ? item.unit : "箱"
              };
            });
          return parsed;
        } catch (error) {
          return newState();
        }
      }

      function saveState(message) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          if (message) showToast(message);
          return true;
        } catch (error) {
          showToast("保存失败：浏览器本地空间可能已满");
          return false;
        }
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toastElement.textContent = message;
        toastElement.hidden = false;
        toastTimer = window.setTimeout(function () {
          toastElement.hidden = true;
        }, 2300);
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function cleanNumber(value) {
        var number = Number(value);
        if (!Number.isFinite(number) || number < 0) return 0;
        return Math.round((number + Number.EPSILON) * 10000) / 10000;
      }

      function emptyLocationCount() {
        return { main: 0, bags: 0 };
      }

      function getItemDayCount(dateKey, itemId) {
        var day = state.records[dateKey];
        var savedItem = day && day[itemId] ? day[itemId] : {};
        var result = {};
        LOCATIONS.forEach(function (location) {
          var locationCount = savedItem[location.key] || emptyLocationCount();
          result[location.key] = {
            main: cleanNumber(locationCount.main),
            bags: cleanNumber(locationCount.bags)
          };
        });
        return result;
      }

      function ensureItemDayCount(dateKey, itemId) {
        if (!state.records[dateKey]) state.records[dateKey] = {};
        if (!state.records[dateKey][itemId]) state.records[dateKey][itemId] = {};
        LOCATIONS.forEach(function (location) {
          if (!state.records[dateKey][itemId][location.key]) {
            state.records[dateKey][itemId][location.key] = emptyLocationCount();
          }
        });
        return state.records[dateKey][itemId];
      }

      function itemTotals(dateKey, itemId) {
        var count = getItemDayCount(dateKey, itemId);
        var total = LOCATIONS.reduce(
          function (total, location) {
            total.main += count[location.key].main;
            total.bags += count[location.key].bags;
            return total;
          },
          { main: 0, bags: 0 }
        );
        return {
          main: cleanNumber(total.main),
          bags: cleanNumber(total.bags)
        };
      }

      function dayHasData(dateKey) {
        return state.items.some(function (item) {
          var total = itemTotals(dateKey, item.id);
          return total.main > 0 || total.bags > 0;
        });
      }

      function recentDateKeys() {
        var keys = [];
        for (var offset = -6; offset <= 0; offset += 1) {
          var key = shiftDate(todayKey(), offset);
          if (key >= state.createdDate) keys.push(key);
        }
        return keys;
      }

      function render() {
        if (view.screen === "setup") {
          renderSetup();
        } else {
          renderInventory();
        }
      }

      function renderSetup() {
        var rows = view.draftItems
          .map(function (item, index) {
            item.counts = normalizeDraftCounts(item.counts);
            var unitOptions = UNITS.map(function (unit) {
              return (
                '<option value="' +
                unit +
                '"' +
                (item.unit === unit ? " selected" : "") +
                ">" +
                unit +
                "</option>"
              );
            }).join("");
            var locationCells = LOCATIONS.map(function (location) {
              return renderDraftLocationCell(item, index, location);
            }).join("");
            var totals = draftTotals(item);
            return (
              '<article class="stock-row setup-row" data-index="' +
              index +
              '">' +
              '<div class="item-identity">' +

              "</span>" +
              '<input class="item-name-input" type="text" maxlength="60" placeholder="填写货品名称" value="' +
              escapeHtml(item.name) +
              '" aria-label="第' +
              (index + 1) +
              '个货品名称" />' +
              '<div class="setup-unit-row">' +
              '<select class="item-unit-select" aria-label="第' +
              (index + 1) +
              '个货品主单位">' +
              unitOptions +
              "</select>" +
              "</div></div>" +
              locationCells +
              '<div class="total-cell">' +
              "<h3>总数</h3>" +
              '<div class="total-line"><strong data-draft-total="main">' +
              totals.main +
              '</strong><span data-draft-unit="main">' +
              escapeHtml(item.unit) +
              "</span></div>" +
              '<div class="total-line"><strong data-draft-total="bags">' +
              totals.bags +
              "</strong><span>袋</span></div>" +
              "</div>" +
              "</article>"
            );
          })
          .join("");

        app.innerHTML =
          '<main class="shell">' +
          '<header class="topbar">' +
          "<div>" +
          '<p class="eyebrow">LOCAL INVENTORY</p>' +
          "<h1>本地点货本</h1>" +
          '<p class="current-date">今天：' +
          prettyDate(todayKey(), true) +
          "</p>" +
          "</div>" +
          "</header>" +
          '<div class="privacy-note"><span class="privacy-dot"></span><span><strong>仅保存在这台设备：</strong>货品名称和数量不会上传到服务器，其他人打开同一网页看到的是空白清单。</span></div>' +
          '<section class="setup-card">' +
          "<h2>" +
          (view.editingExistingList ? "编辑货物清单" : "建立你的货物清单") +
          "</h2>" +
          '<p class="setup-intro">填写货品名称和主单位，也可以直接填写今天（' +
          prettyDate(todayKey(), true) +
          '）的数量。每个储存地点上行是主单位，下行固定为“袋”。</p>' +
          '<div class="stock-head setup-head"><div>货品名称 / 主单位</div><div>常温</div><div>冻房</div><div>风房</div><div>总数</div></div>' +
          '<div id="setupRows">' +
          rows +
          "</div>" +
          '<div class="setup-footer">' +
          '<button id="addRow" class="button secondary" type="button">＋ 添加空白行</button>' +
          '<div class="setup-actions">' +
          (view.editingExistingList
            ? '<button id="cancelSetup" class="button secondary" type="button">取消</button>'
            : "") +
          '<button id="saveList" class="button primary" type="button">保存清单和今天数量</button>' +
          "</div>" +
          "</div>" +
          '<p class="setup-help">三个地点的数量会分别保存，最右侧自动汇总主单位和袋数。清单保存后仍可从右上角菜单修改。</p>' +
          "</section>" +
          '<footer class="footer-note">请勿使用无痕模式。清除浏览器网站数据会删除本机清单，请定期导出备份。</footer>' +
          "</main>";

        bindSetupEvents();
      }

      function renderDraftLocationCell(item, index, location) {
        var count = item.counts[location.key];
        return (
          '<div class="stock-cell" data-location="' +
          location.key +
          '">' +
          "<h3>" +
          location.label +
          "</h3>" +
          renderDraftStepper(index, location, "main", count.main, item.unit) +
          renderDraftStepper(index, location, "bags", count.bags, "袋") +
          "</div>"
        );
      }

      function renderDraftStepper(index, location, field, value, unit) {
        var label = "第" + (index + 1) + "个货品 " + location.label + " " + unit + "数量";
        return (
          '<div class="count-line"><div class="stepper">' +
          '<button type="button" data-draft-action="adjust" data-field="' +
          field +
          '" data-delta="-1" aria-label="' +
          escapeHtml(label + "减1") +
          '">−</button>' +
          '<label class="quantity-wrap"><input class="draft-quantity" type="number" min="0" step="any" inputmode="decimal" data-field="' +
          field +
          '" value="' +
          value +
          '" aria-label="' +
          escapeHtml(label) +
          '" /><span' +
          (field === "main" ? ' data-draft-unit="main"' : "") +
          ">" +
          escapeHtml(unit) +
          "</span></label>" +
          '<button type="button" data-draft-action="adjust" data-field="' +
          field +
          '" data-delta="1" aria-label="' +
          escapeHtml(label + "加1") +
          '">＋</button>' +
          "</div></div>"
        );
      }

      function bindSetupEvents() {
        document.getElementById("setupRows").addEventListener("input", function (event) {
          var row = event.target.closest(".setup-row");
          if (!row) return;
          var index = Number(row.dataset.index);
          if (event.target.classList.contains("item-name-input")) {
            view.draftItems[index].name = event.target.value;
          }
          if (event.target.classList.contains("item-unit-select")) {
            view.draftItems[index].unit = event.target.value;
            row.querySelectorAll('[data-draft-unit="main"]').forEach(function (label) {
              label.textContent = event.target.value;
            });
          }
          if (event.target.classList.contains("draft-quantity")) {
            var cell = event.target.closest(".stock-cell");
            var locationKey = cell.dataset.location;
            var field = event.target.dataset.field;
            var rawValue = event.target.value;
            if (rawValue === "") return;
            var numericValue = Number(rawValue);
            if (!Number.isFinite(numericValue) || numericValue < 0) return;
            var value = cleanNumber(numericValue);
            view.draftItems[index].counts[locationKey][field] = value;
            updateDraftRowTotal(row, index);
          }
        });

        document.getElementById("setupRows").addEventListener("change", function (event) {
          if (!event.target.classList.contains("draft-quantity")) return;
          var row = event.target.closest(".setup-row");
          var index = Number(row.dataset.index);
          var cell = event.target.closest(".stock-cell");
          var locationKey = cell.dataset.location;
          var field = event.target.dataset.field;
          var value = cleanNumber(event.target.value);
          view.draftItems[index].counts[locationKey][field] = value;
          event.target.value = String(value);
          updateDraftRowTotal(row, index);
        });

        document.getElementById("setupRows").addEventListener("click", function (event) {
          var row = event.target.closest(".setup-row");
          if (!row) return;
          var index = Number(row.dataset.index);

          var adjustButton = event.target.closest('button[data-draft-action="adjust"]');
          if (!adjustButton) return;
          var cell = adjustButton.closest(".stock-cell");
          var locationKey = cell.dataset.location;
          var field = adjustButton.dataset.field;
          var delta = Number(adjustButton.dataset.delta);
          var draftCount = view.draftItems[index].counts[locationKey];
          draftCount[field] = cleanNumber(
            Math.max(0, cleanNumber(draftCount[field]) + delta)
          );
          cell.querySelector('input[data-field="' + field + '"]').value = String(draftCount[field]);
          updateDraftRowTotal(row, index);
        });

        document.getElementById("setupRows").addEventListener("focusin", function (event) {
          if (event.target.classList.contains("draft-quantity")) event.target.select();
        });

        document.getElementById("addRow").addEventListener("click", function () {
          if (view.draftItems.length >= 100) {
            showToast("最多可设置100种货品");
            return;
          }
          view.draftItems.push(makeBlankRows(1)[0]);
          renderSetup();
          var inputs = document.querySelectorAll(".item-name-input");
          inputs[inputs.length - 1].focus();
        });

        document.getElementById("saveList").addEventListener("click", saveItemList);

        var cancelButton = document.getElementById("cancelSetup");
        if (cancelButton) {
          cancelButton.addEventListener("click", function () {
            view.screen = "inventory";
            view.editingExistingList = false;
            view.draftItems = [];
            render();
          });
        }
      }

      function updateDraftRowTotal(row, index) {
        var totals = draftTotals(view.draftItems[index]);
        row.querySelector('[data-draft-total="main"]').textContent = String(totals.main);
        row.querySelector('[data-draft-total="bags"]').textContent = String(totals.bags);
      }

      function saveItemList() {
        var wasNewList = state.items.length === 0;
        var cleaned = view.draftItems
          .map(function (item) {
            return {
              id: item.id || makeId(),
              name: item.name.trim(),
              unit: UNITS.indexOf(item.unit) >= 0 ? item.unit : "箱",
              counts: normalizeDraftCounts(item.counts)
            };
          })
          .filter(function (item) {
            return item.name;
          });

        if (!cleaned.length) {
          showToast("请至少填写一种货品");
          return;
        }

        var names = cleaned.map(function (item) {
          return item.name.toLocaleLowerCase();
        });
        var duplicates = names.filter(function (name, index) {
          return names.indexOf(name) !== index;
        });
        if (duplicates.length) {
          showToast("货品名称不能重复");
          return;
        }

        state.items = cleaned.map(function (item) {
          return { id: item.id, name: item.name, unit: item.unit };
        });
        if (wasNewList) state.createdDate = todayKey();
        if (!state.records[todayKey()]) state.records[todayKey()] = {};
        cleaned.forEach(function (item) {
          state.records[todayKey()][item.id] = normalizeDraftCounts(item.counts);
        });
        if (!saveState("货物清单已保存在本机")) return;
        view.screen = "inventory";
        view.editingExistingList = false;
        view.selectedDate = todayKey();
        view.editHistory = false;
        view.draftItems = [];
        render();
      }

      function renderInventory() {
        var today = todayKey();
        if (view.selectedDate > today) view.selectedDate = today;
        if (view.selectedDate < state.createdDate) view.selectedDate = state.createdDate;

        var isToday = view.selectedDate === today;
        var canEdit = isToday || view.editHistory;
        var filteredItems = state.items.filter(function (item) {
          return item.name.toLocaleLowerCase().includes(view.search.toLocaleLowerCase().trim());
        });

        var recentButtons = recentDateKeys()
          .map(function (key) {
            var hasData = dayHasData(key);
            return (
              '<button class="recent-day' +
              (view.selectedDate === key ? " active" : "") +
              (hasData ? " has-data" : "") +
              '" type="button" data-date="' +
              key +
              '">' +
              "<strong>" +
              prettyDate(key, false).replace(/星期|周/g, "") +
              "</strong>" +
              "<small>" +
              (hasData ? "有数量" : "全0") +
              "</small>" +
              "</button>"
            );
          })
          .join("");

        var rows = filteredItems
          .map(function (item, index) {
            var counts = getItemDayCount(view.selectedDate, item.id);
            var cells = LOCATIONS.map(function (location) {
              return renderLocationCell(item, location, counts[location.key], canEdit);
            }).join("");
            var totals = itemTotals(view.selectedDate, item.id);
            return (
              '<article class="stock-row" data-item-id="' +
              escapeHtml(item.id) +
              '">' +
              '<div class="item-identity">' +
              '<span class="item-number">货品 ' +
              (state.items.indexOf(item) + 1) +
              "</span>" +
              "<h2>" +
              escapeHtml(item.name) +
              "</h2>" +
              '<span class="unit-tag">主单位：' +
              escapeHtml(item.unit) +
              "</span>" +
              "</div>" +
              cells +
              '<div class="total-cell">' +
              "<h3>总数</h3>" +
              '<div class="total-line"><strong data-total="main">' +
              totals.main +
              "</strong><span>" +
              escapeHtml(item.unit) +
              "</span></div>" +
              '<div class="total-line"><strong data-total="bags">' +
              totals.bags +
              "</strong><span>袋</span></div>" +
              "</div>" +
              "</article>"
            );
          })
          .join("");

        app.innerHTML =
          '<main class="shell">' +
          '<header class="topbar">' +
          "<div>" +
          '<p class="eyebrow">DAILY INVENTORY</p>' +
          "<h1>本地点货本</h1>" +
          '<p class="current-date">今天：' +
          prettyDate(todayKey(), true) +
          "</p>" +
          "</div>" +
          '<div class="top-actions">' +
          '<button id="todayButton" class="button secondary" type="button">回到今天</button>' +
          '<button id="menuButton" class="icon-button" type="button" aria-label="更多操作" aria-expanded="' +
          String(view.menuOpen) +
          '">•••</button>' +
          '<div id="menu" class="menu"' +
          (view.menuOpen ? "" : " hidden") +
          ">" +
          '<button type="button" data-menu-action="edit-list">编辑货物清单</button>' +
          '<button type="button" data-menu-action="export">导出本机备份</button>' +
          '<button type="button" data-menu-action="import">恢复本机备份</button>' +
          '<button class="danger-text" type="button" data-menu-action="clear">清空本机全部资料</button>' +
          "</div>" +
          "</div>" +
          "</header>" +
          '<div class="privacy-note"><span class="privacy-dot"></span><span><strong>本机自动保存：</strong>清单和每日数字只存放在当前浏览器，不会上传到服务器。</span></div>' +
          '<section class="date-panel">' +
          "<div>" +
          '<div class="date-main">' +
          '<button id="prevDate" class="date-nav" type="button" aria-label="前一天"' +
          (view.selectedDate <= state.createdDate ? " disabled" : "") +
          ">‹</button>" +
          '<input id="datePicker" type="date" min="' +
          state.createdDate +
          '" max="' +
          today +
          '" value="' +
          view.selectedDate +
          '" aria-label="选择盘点日期" />' +
          '<button id="nextDate" class="date-nav" type="button" aria-label="后一天"' +
          (view.selectedDate >= today ? " disabled" : "") +
          ">›</button>" +
          "</div>" +
          '<div class="date-summary">' +
          '<p class="date-title"><strong>' +
          prettyDate(view.selectedDate, true) +
          "</strong><br />" +
          (isToday ? "今天的数据会实时保存" : "历史日期的数据默认锁定") +
          "</p>" +
          (isToday
            ? '<span class="today-badge">今天</span>'
            : '<span class="history-badge">历史记录</span>') +
          "</div>" +
          "</div>" +
          '<div class="recent-wrap"><p>最近日期</p><div class="recent-days">' +
          recentButtons +
          "</div></div>" +
          "</section>" +
          (!isToday
            ? '<div class="history-warning"><span><strong>' +
              (view.editHistory ? "正在修改历史记录" : "历史记录为只读") +
              "：</strong>" +
              (view.editHistory
                ? "修改会立即保存在本机，完成后请重新锁定。"
                : "这样可以避免日常点货时误改以前的数据。") +
              '</span><button id="historyEditButton" class="button ' +
              (view.editHistory ? "primary" : "secondary") +
              ' small" type="button">' +
              (view.editHistory ? "完成修改并锁定" : "修改历史记录") +
              "</button></div>"
            : "") +
          '<div class="toolbar">' +
          '<label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="搜索货品名称" value="' +
          escapeHtml(view.search) +
          '" /></label>' +
          '<span class="item-count">共 ' +
          state.items.length +
          " 种货品</span>" +
          "</div>" +
          '<div class="stock-head"><div>货品</div><div>常温</div><div>冻房</div><div>风房</div><div>总数</div></div>' +
          '<section id="stockList">' +
          (rows || '<div class="empty-result">没有找到相符的货品</div>') +
          "</section>" +
          '<footer class="footer-note">未填写的日期和数量均按0显示。换设备前请先导出备份。</footer>' +
          "</main>";

        bindInventoryEvents(canEdit, isToday);
      }

      function renderLocationCell(item, location, count, canEdit) {
        return (
          '<div class="stock-cell" data-location="' +
          location.key +
          '">' +
          "<h3>" +
          location.label +
          "</h3>" +
          renderStepper(item, location, "main", count.main, item.unit, canEdit) +
          renderStepper(item, location, "bags", count.bags, "袋", canEdit) +
          "</div>"
        );
      }

      function renderStepper(item, location, field, value, unit, canEdit) {
        var label = item.name + " " + location.label + " " + unit + "数量";
        return (
          '<div class="count-line"><div class="stepper">' +
          '<button type="button" data-action="adjust" data-field="' +
          field +
          '" data-delta="-1" aria-label="' +
          escapeHtml(label + "减1") +
          '"' +
          (canEdit ? "" : " disabled") +
          ">−</button>" +
          '<label class="quantity-wrap"><input type="number" min="0" step="any" inputmode="decimal" data-action="quantity" data-field="' +
          field +
          '" value="' +
          value +
          '" aria-label="' +
          escapeHtml(label) +
          '"' +
          (canEdit ? "" : " disabled") +
          " /><span>" +
          escapeHtml(unit) +
          "</span></label>" +
          '<button type="button" data-action="adjust" data-field="' +
          field +
          '" data-delta="1" aria-label="' +
          escapeHtml(label + "加1") +
          '"' +
          (canEdit ? "" : " disabled") +
          ">＋</button>" +
          "</div></div>"
        );
      }

      function bindInventoryEvents(canEdit, isToday) {
        document.getElementById("todayButton").addEventListener("click", function () {
          view.selectedDate = todayKey();
          view.editHistory = false;
          renderInventory();
        });

        document.getElementById("menuButton").addEventListener("click", function () {
          view.menuOpen = !view.menuOpen;
          var menu = document.getElementById("menu");
          menu.hidden = !view.menuOpen;
          document.getElementById("menuButton").setAttribute("aria-expanded", String(view.menuOpen));
        });

        document.getElementById("menu").addEventListener("click", handleMenuAction);

        document.getElementById("prevDate").addEventListener("click", function () {
          if (view.selectedDate <= state.createdDate) return;
          view.selectedDate = shiftDate(view.selectedDate, -1);
          view.editHistory = false;
          renderInventory();
        });

        document.getElementById("nextDate").addEventListener("click", function () {
          if (view.selectedDate >= todayKey()) return;
          view.selectedDate = shiftDate(view.selectedDate, 1);
          view.editHistory = false;
          renderInventory();
        });

        document.getElementById("datePicker").addEventListener("change", function (event) {
          var selected = event.target.value;
          if (!selected) return;
          if (selected < state.createdDate) selected = state.createdDate;
          if (selected > todayKey()) selected = todayKey();
          view.selectedDate = selected;
          view.editHistory = false;
          renderInventory();
        });

        document.querySelector(".recent-days").addEventListener("click", function (event) {
          var button = event.target.closest(".recent-day");
          if (!button) return;
          view.selectedDate = button.dataset.date;
          view.editHistory = false;
          renderInventory();
        });

        var historyEditButton = document.getElementById("historyEditButton");
        if (historyEditButton) {
          historyEditButton.addEventListener("click", function () {
            if (!view.editHistory) {
              var approved = window.confirm(
                "即将修改 " +
                  prettyDate(view.selectedDate, true) +
                  " 的历史记录。修改会覆盖原来的数字，确定继续吗？"
              );
              if (!approved) return;
              view.editHistory = true;
            } else {
              view.editHistory = false;
              showToast("历史记录已保存并重新锁定");
            }
            renderInventory();
          });
        }

        var searchInput = document.getElementById("searchInput");
        searchInput.addEventListener("input", function (event) {
          view.search = event.target.value;
          renderInventory();
          var nextSearch = document.getElementById("searchInput");
          nextSearch.focus();
          nextSearch.setSelectionRange(view.search.length, view.search.length);
        });

        if (canEdit) {
          document.getElementById("stockList").addEventListener("click", handleStockClick);
          document.getElementById("stockList").addEventListener("input", handleQuantityInput);
          document.getElementById("stockList").addEventListener("change", handleQuantityChange);
          document.getElementById("stockList").addEventListener("focusin", function (event) {
            if (event.target.matches('input[data-action="quantity"]')) {
              event.target.select();
            }
          });
        }
      }

      function handleStockClick(event) {
        var button = event.target.closest('button[data-action="adjust"]');
        if (!button) return;
        var row = button.closest(".stock-row");
        var cell = button.closest(".stock-cell");
        var itemId = row.dataset.itemId;
        var locationKey = cell.dataset.location;
        var field = button.dataset.field;
        var delta = Number(button.dataset.delta);
        var itemCount = ensureItemDayCount(view.selectedDate, itemId);
        itemCount[locationKey][field] = cleanNumber(
          Math.max(0, cleanNumber(itemCount[locationKey][field]) + delta)
        );
        saveState();
        updateRowDisplay(row, itemId);
      }

      function handleQuantityChange(event) {
        var input = event.target.closest('input[data-action="quantity"]');
        if (!input) return;
        var row = input.closest(".stock-row");
        var cell = input.closest(".stock-cell");
        var itemId = row.dataset.itemId;
        var locationKey = cell.dataset.location;
        var field = input.dataset.field;
        var value = cleanNumber(input.value);
        input.value = String(value);
        var itemCount = ensureItemDayCount(view.selectedDate, itemId);
        itemCount[locationKey][field] = value;
        saveState();
        updateRowDisplay(row, itemId);
      }

      function handleQuantityInput(event) {
        var input = event.target.closest('input[data-action="quantity"]');
        if (!input || input.value === "") return;
        var numericValue = Number(input.value);
        if (!Number.isFinite(numericValue) || numericValue < 0) return;
        var row = input.closest(".stock-row");
        var cell = input.closest(".stock-cell");
        var itemId = row.dataset.itemId;
        var locationKey = cell.dataset.location;
        var field = input.dataset.field;
        var itemCount = ensureItemDayCount(view.selectedDate, itemId);
        itemCount[locationKey][field] = cleanNumber(numericValue);
        saveState();
        var totals = itemTotals(view.selectedDate, itemId);
        row.querySelector('[data-total="main"]').textContent = String(totals.main);
        row.querySelector('[data-total="bags"]').textContent = String(totals.bags);
      }

      function updateRowDisplay(row, itemId) {
        var counts = getItemDayCount(view.selectedDate, itemId);
        LOCATIONS.forEach(function (location) {
          var cell = row.querySelector('[data-location="' + location.key + '"]');
          cell.querySelector('input[data-field="main"]').value = String(
            counts[location.key].main
          );
          cell.querySelector('input[data-field="bags"]').value = String(
            counts[location.key].bags
          );
        });
        var totals = itemTotals(view.selectedDate, itemId);
        row.querySelector('[data-total="main"]').textContent = String(totals.main);
        row.querySelector('[data-total="bags"]').textContent = String(totals.bags);
      }

      function handleMenuAction(event) {
        var button = event.target.closest("button[data-menu-action]");
        if (!button) return;
        var action = button.dataset.menuAction;
        view.menuOpen = false;

        if (action === "edit-list") {
          view.draftItems = state.items.map(function (item) {
            return {
              id: item.id,
              name: item.name,
              unit: item.unit,
              counts: getItemDayCount(todayKey(), item.id)
            };
          });
          view.screen = "setup";
          view.editingExistingList = true;
          render();
          return;
        }

        if (action === "export") {
          exportBackup();
          return;
        }

        if (action === "import") {
          importFile.value = "";
          importFile.click();
          return;
        }

        if (action === "clear") {
          var approved = window.confirm(
            "这会删除当前浏览器中的货物清单和全部历史记录，而且无法撤销。确定清空吗？"
          );
          if (!approved) return;
          localStorage.removeItem(STORAGE_KEY);
          state = newState();
          view = {
            screen: "setup",
            selectedDate: todayKey(),
            editHistory: false,
            search: "",
            menuOpen: false,
            editingExistingList: false,
            draftItems: makeBlankRows(24)
          };
          render();
          showToast("本机资料已清空");
        }
      }

      function exportBackup() {
        var payload = {
          app: "本地点货本",
          exportedAt: new Date().toISOString(),
          data: state
        };
        var blob = new Blob([JSON.stringify(payload, null, 2)], {
          type: "application/json;charset=utf-8"
        });
        var url = URL.createObjectURL(blob);
        var anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = "本地点货本备份-" + todayKey() + ".json";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        window.setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
        showToast("备份文件已下载，请妥善保管");
      }

      importFile.addEventListener("change", function (event) {
        var file = event.target.files && event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(String(reader.result));
            var imported = parsed && parsed.data ? parsed.data : parsed;
            if (
              !imported ||
              imported.version !== 1 ||
              !Array.isArray(imported.items) ||
              !imported.records ||
              typeof imported.records !== "object"
            ) {
              throw new Error("invalid backup");
            }
            var approved = window.confirm(
              "恢复备份会覆盖当前浏览器里的清单和历史记录，确定继续吗？"
            );
            if (!approved) return;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(imported));
            state = loadState();
            view.screen = state.items.length ? "inventory" : "setup";
            view.selectedDate = todayKey();
            view.editHistory = false;
            view.search = "";
            view.menuOpen = false;
            view.editingExistingList = false;
            view.draftItems = state.items.length ? [] : makeBlankRows(24);
            render();
            showToast("备份已恢复");
          } catch (error) {
            showToast("无法读取这个备份文件");
          }
        };
        reader.readAsText(file);
      });

      document.addEventListener("click", function (event) {
        if (!view.menuOpen) return;
        if (event.target.closest(".top-actions")) return;
        view.menuOpen = false;
        var menu = document.getElementById("menu");
        if (menu) menu.hidden = true;
        var menuButton = document.getElementById("menuButton");
        if (menuButton) menuButton.setAttribute("aria-expanded", "false");
      });

      window.setInterval(function () {
        var newToday = todayKey();
        if (newToday === lastKnownToday) return;
        var oldToday = lastKnownToday;
        lastKnownToday = newToday;
        if (view.screen === "inventory" && view.selectedDate === oldToday) {
          view.selectedDate = newToday;
          view.editHistory = false;
          renderInventory();
          showToast("日期已更新，今天的数量从0开始");
        }
      }, 30000);

      render();
    </script>
  </body>
</html>
